<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bốc Thăm Lì Xì</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Segoe UI,Roboto,Arial}
  body{
    min-height:100vh;overflow:hidden;
    background: radial-gradient(ellipse at center,#ffb347 0%,#ff6a00 35%,#c40000 100%);
  }
  .stage{position:relative;display:flex;align-items:center;justify-content:center;height:100vh}

  /* falling petals + gold dots */
  .bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .dot{position:absolute;width:6px;height:6px;border-radius:50%;background:gold;opacity:.8;animation:fall linear infinite}
  .petal{position:absolute;width:10px;height:10px;border-radius:50% 60% 40% 60%;background:#ffd1dc;opacity:.9;animation:fall linear infinite}
  @keyframes fall{0%{transform:translateY(-10vh) translateX(0) rotate(0)}100%{transform:translateY(110vh) translateX(40px) rotate(360deg)}}

  .wrapper{position:relative}
  .envelope{
    position:relative;width:min(42vw,260px);height:min(70vw,420px);
    background:linear-gradient(180deg,#ff2d2d,#d10000);
    border-radius:20px;border:4px solid #ffd54d;
    box-shadow:0 0 40px rgba(255,215,0,.7), inset 0 -30px 60px rgba(0,0,0,.25);
    cursor:pointer;transform-style:preserve-3d;transition:.3s;
    overflow:hidden; /* clip shine inside envelope */
  }
  .envelope.disabled{pointer-events:none;filter:grayscale(.3)}

  /* flap */
  .flap{
    position:absolute;top:0;left:0;width:100%;height:32%;
    background:linear-gradient(145deg,#ff3b3b,#b80000);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top;transition:.7s ease;z-index:3;
  }
  .envelope.open .flap{transform:rotateX(160deg)}

  /* seal */
  .seal{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle,#ffe27a,#ffb300);
    border:4px solid gold;display:flex;align-items:center;justify-content:center;
    color:#b30000;font-weight:700;font-size:22px;letter-spacing:.5px;
    box-shadow:0 0 25px gold,inset 0 0 15px rgba(255,255,255,.6);
    transition:.4s;z-index:4;text-align:center
  }
  .envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.6)}

  /* crack before open */
  .crack{position:absolute;inset:0;pointer-events:none;z-index:5}
  .crack::before,.crack::after{content:"";position:absolute;left:50%;top:10%;width:2px;height:0;background:#fff;opacity:.9;box-shadow:0 0 10px #fff}
  .crack::after{transform:translateX(12px) rotate(12deg)}
  .cracking::before{animation:cr1 .35s forwards}
  .cracking::after{animation:cr2 .35s forwards}
  @keyframes cr1{to{height:65%;transform:translateX(-6px) rotate(-8deg)}}
  @keyframes cr2{to{height:60%}}

  /* shine sweep */
  .shine{position:absolute;top:0;left:-60%;width:30%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.9),transparent);
    transform:skewX(-20deg);animation:shine 2.6s infinite;pointer-events:none;z-index:2}
  @keyframes shine{0%{left:-60%}100%{left:160%}}}

  /* money */
  .money{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.6);
    padding:10px 16px;border-radius:10px;background:#fff;color:#0b6b2e;
    font-weight:800;opacity:0;z-index:1;box-shadow:0 8px 20px rgba(0,0,0,.2)}
  .money.fly{animation:fly 1.2s ease forwards}
  @keyframes fly{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1}100%{opacity:1;transform:translate(-50%,-220%) scale(1)}}

  /* suspense text */
  .hint{position:absolute;left:50%;top:15%;transform:translateX(-50%);
    color:#fff;font-weight:700;opacity:0}
  .hint.show{animation:hint .9s ease}
  @keyframes hint{0%{opacity:0;transform:translate(-50%,-10px)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,10px)}}

  /* fireworks */
  .fireworks{position:absolute;inset:0;pointer-events:none}
  .fw{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:0}
  .fw.boom{animation:boom .9s ease forwards}
  @keyframes boom{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(2)}}

  .status{position:absolute;bottom:8vh;left:50%;transform:translateX(-50%);color:#fff;opacity:.9}

  @media (max-width:600px){
    .seal{width:74px;height:74px;font-size:18px}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="bg" id="bg"></div>
  <div class="wrapper">
    <div id="env" class="envelope">
      <div class="flap"></div>
      <div class="seal">Lì xì</div>
      <div class="shine"></div>
      <div id="money" class="money"></div>
      <div id="hint" class="hint">Suýt trúng 100k!</div>
      <div id="crack" class="crack"></div>
    </div>
  </div>
  <div id="fw" class="fireworks"></div>
  <div id="status" class="status"></div>
</div>
<script>
  // background particles
  const bg=document.getElementById('bg');
  for(let i=0;i<28;i++){
    const d=document.createElement('div');d.className='dot';
    d.style.left=Math.random()*100+'%';
    d.style.animationDuration=(6+Math.random()*6)+'s';
    d.style.animationDelay=(Math.random()*6)+'s';bg.appendChild(d);
  }
  for(let i=0;i<16;i++){
    const p=document.createElement('div');p.className='petal';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(8+Math.random()*6)+'s';
    p.style.animationDelay=(Math.random()*6)+'s';bg.appendChild(p);
  }

  const env=document.getElementById('env');
  const moneyEl=document.getElementById('money');
  const hint=document.getElementById('hint');
  const crack=document.getElementById('crack');
  const status=document.getElementById('status');
  const fw=document.getElementById('fw');

  const KEY='lixi_opened_v1';
  if(localStorage.getItem(KEY)){
    env.classList.add('disabled');
    status.textContent='Bạn đã nhận lì xì rồi!';
  }

  function weightedDraw(){
    // Jackpot 100k = 4%
    // 20k,10k higher
    const r=Math.random();
    if(r<0.04) return 100000;      // 4%
    if(r<0.14) return 50000;       // 10%
    if(r<0.44) return 20000;       // 30%
    if(r<0.74) return 10000;       // 30%
    if(r<0.89) return 5000;        // 15%
    return 2000;                   // 11%
  }

  function nearMiss(){
    // 4% jackpot; additional 4% near-miss window
    const r=Math.random();
    return r>=0.04 && r<0.08;
  }

  function fireworkBurst(){
    for(let i=0;i<60;i++){
      const s=document.createElement('div');
      s.className='fw boom';
      const angle=Math.random()*Math.PI*2;
      const dist=60+Math.random()*120;
      s.style.left=(40+Math.random()*20)+'%';
      s.style.top=(20+Math.random()*20)+'%';
      s.style.setProperty('--x',Math.cos(angle)*dist+'px');
      s.style.setProperty('--y',Math.sin(angle)*dist+'px');
      fw.appendChild(s);
      setTimeout(()=>s.remove(),900);
    }
  }

  function formatVND(v){return v.toLocaleString('vi-VN')+'đ'}

  env.addEventListener('click',()=>{
    if(env.classList.contains('disabled')) return;
    env.classList.add('disabled');

    // crack first
    crack.classList.add('cracking');

    setTimeout(()=>{
      env.classList.add('open');

      let value=weightedDraw();
      const isNear=nearMiss() && value!==100000;

      if(isNear){
        hint.textContent='Suýt trúng 100k!';
        hint.classList.add('show');
        // fake flash 100k then downgrade
        moneyEl.textContent='100.000đ';
        moneyEl.style.background='#fffbe6';
        moneyEl.classList.add('fly');
        setTimeout(()=>{
          moneyEl.classList.remove('fly');
          void moneyEl.offsetWidth;
          value = 20000; // suspense downgrade
          moneyEl.textContent=formatVND(value);
          moneyEl.style.background='#ffffff';
          moneyEl.classList.add('fly');
        },450);
      }else{
        moneyEl.textContent=formatVND(value);
        moneyEl.classList.add('fly');
      }

      if(value>=50000){
        setTimeout(fireworkBurst,300);
      }

      status.textContent='Chúc mừng! Bạn nhận được '+formatVND(value);
      localStorage.setItem(KEY,'1');
    },380);
  });
</script>
</body>
</html>
